<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neighborhoods | Nestora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="curtain"></div>

  <main>
    <section class="page-hero">
      <p class="eyebrow reveal" style="--d:.5s">Know the area</p>
      <h1 class="reveal" style="--d:.65s">Find your <em>kind</em> of neighborhood</h1>
      <p class="hero-sub reveal" style="--d:.8s">Tap a district on the map to see its homes, prices and personality.</p>
    </section>

    <!-- INTERACTIVE MAP -->
        <section class="map-section">
      <div class="map-real">
        <div id="map"></div>
        <p class="map-count" id="mapCount"></p>
                <div class="map-switch" id="mapSwitch">
          <button type="button" class="active" data-mode="pins">Map</button>
          <button type="button" data-mode="areas">Price areas</button>
        </div>
      </div>
    </section>

       <section class="hood-section">
      <nav class="hood-bar reveal" aria-label="Neighborhoods">
        <a class="hood-item" href="listings.html?location=Lakeside">
          <span class="hood-no">01</span>
          <span class="hood-text"><strong>Lakeside</strong><small>By the water, in your own rhythm</small></span>
          <span class="hood-arrow">↗</span>
        </a>
        <a class="hood-item" href="listings.html?location=Old Town">
          <span class="hood-no">02</span>
          <span class="hood-text"><strong>Old Town</strong><small>A little more life around you</small></span>
          <span class="hood-arrow">↗</span>
        </a>
        <a class="hood-item" href="listings.html?location=Hillcrest">
          <span class="hood-no">03</span>
          <span class="hood-text"><strong>Hillcrest</strong><small>Room to spread out and breathe</small></span>
          <span class="hood-arrow">↗</span>
        </a>
        <a class="hood-item" href="listings.html?location=Harbour">
          <span class="hood-no">04</span>
          <span class="hood-text"><strong>Harbour</strong><small>Salt air, just around the corner</small></span>
          <span class="hood-arrow">↗</span>
        </a>
      </nav>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
