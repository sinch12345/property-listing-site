<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homes | Nestora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="curtain"></div>

  <main>
    <section class="page-hero">
      <p class="eyebrow reveal" style="--d:.5s">All homes</p>
      <h1 class="reveal" style="--d:.65s">Every home has a <em>story</em></h1>
      <p class="hero-sub reveal" style="--d:.8s">Filter by area, price and vibe to find yours.</p>
    </section>

    <!-- FILTER BAR -->
    <section class="filter-section">
      <div class="filter-bar reveal" id="filterBar" style="--d:.9s">
        <div class="filter-selects">
          <label class="filter-field">
            <span>Neighborhood</span>
            <select id="fLocation">
              <option value="">Anywhere</option>
              <option>Lakeside</option>
              <option>Old Town</option>
              <option>Hillcrest</option>
              <option>Harbour</option>
            </select>
          </label>

          <label class="filter-field">
            <span>Type</span>
            <select id="fType">
              <option value="">Any type</option>
              <option>Apartment</option>
              <option>Villa</option>
              <option>Townhouse</option>
              <option>Studio</option>
            </select>
          </label>

          <label class="filter-field">
            <span>Max budget</span>
            <select id="fBudget">
              <option value="">No limit</option>
              <option value="200000">$200,000</option>
              <option value="400000">$400,000</option>
              <option value="700000">$700,000</option>
              <option value="1000000">$1,000,000</option>
            </select>
          </label>

          <button type="button" class="btn btn-ghost clear-btn" id="clearFilters">Clear all</button>
        </div>

        <div class="vibe-row">
          <span class="vibe-label">Vibe</span>
          <div class="vibe-pills">
            <button type="button" class="vibe-pill" data-vibe="Sunlit mornings">Sunlit mornings</button>
            <button type="button" class="vibe-pill" data-vibe="Quiet street">Quiet street</button>
            <button type="button" class="vibe-pill" data-vibe="Work-from-home ready">Work-from-home ready</button>
            <button type="button" class="vibe-pill" data-vibe="Pet friendly">Pet friendly</button>
            <button type="button" class="vibe-pill" data-vibe="Great for hosting">Great for hosting</button>
          </div>
        </div>
      </div>
    </section>

    <section class="listings" id="listings">
      <div class="section-head">
        <p class="result-count" id="resultCount"></p>
        <label class="sort">
          <span>Sort by</span>
          <select id="sortBy">
            <option value="newest">Newest</option>
            <option value="priceLow">Price: low to high</option>
            <option value="priceHigh">Price: high to low</option>
          </select>
        </label>
      </div>

      <div class="grid" id="propertyGrid"></div>

      <p class="empty-note" id="noResults" hidden>
        No homes match those filters. Try removing one, or press <strong>Clear all</strong>.
      </p>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
