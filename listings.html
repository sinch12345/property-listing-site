<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homes | Nestora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="curtain"></div>

  <main>
    <section class="page-hero">
      <p class="eyebrow reveal" style="--d:.5s">All homes</p>
      <h1 class="reveal" style="--d:.65s">Every home has a <em>story</em></h1>
      <p class="hero-sub reveal" style="--d:.8s">Filter by area, price and vibe to find yours.</p>
    </section>

    <!-- FILTER BAR -->
        <section class="shop">
      <aside class="filter-bar reveal" id="filterBar" style="--d:.9s">
        <div class="filter-head">
          <h3>Make it yours</h3>
          <button type="button" class="clear-link" id="clearFilters">Clear all</button>
        </div>

        <div class="filter-selects">
          <label class="filter-field">
            <span>Neighborhood</span>
            <select id="fLocation">
              <option value="">Any neighborhood</option>
              <option>Lakeside</option>
              <option>Old Town</option>
              <option>Hillcrest</option>
              <option>Harbour</option>
            </select>
          </label>

          <label class="filter-field">
            <span>Home type</span>
            <select id="fType">
              <option value="">Any home type</option>
              <option>Apartment</option>
              <option>Villa</option>
              <option>Townhouse</option>
              <option>Studio</option>
            </select>
          </label>

                    <div class="filter-field">
            <div class="range-head"><span>Max price</span><output id="budgetOut">No limit</output></div>
            <input type="range" id="fBudget" min="150000" max="1250000" step="50000" value="1250000">
            <div class="range-ends"><small>$150k</small><small>$1.25m</small></div>
          </div>
        </div>

                <div class="chip-group">
          <span class="vibe-label">Bedrooms</span>
          <div class="chip-row">
            <button type="button" class="num-chip active" data-group="beds" data-value="">Any</button>
            <button type="button" class="num-chip" data-group="beds" data-value="1">1+</button>
            <button type="button" class="num-chip" data-group="beds" data-value="2">2+</button>
            <button type="button" class="num-chip" data-group="beds" data-value="3">3+</button>
            <button type="button" class="num-chip" data-group="beds" data-value="4">4+</button>
          </div>
        </div>

        <div class="chip-group">
          <span class="vibe-label">Bathrooms</span>
          <div class="chip-row">
            <button type="button" class="num-chip active" data-group="baths" data-value="">Any</button>
            <button type="button" class="num-chip" data-group="baths" data-value="1">1+</button>
            <button type="button" class="num-chip" data-group="baths" data-value="2">2+</button>
            <button type="button" class="num-chip" data-group="baths" data-value="3">3+</button>
          </div>
        </div>
        
        <div class="vibe-row">
          <span class="vibe-label">Your must-haves</span>
          <div class="vibe-pills">
            <button type="button" class="vibe-pill" data-vibe="Sunlit mornings">Sunlit mornings</button>
            <button type="button" class="vibe-pill" data-vibe="Quiet street">Quiet street</button>
            <button type="button" class="vibe-pill" data-vibe="Work-from-home ready">Work-from-home ready</button>
            <button type="button" class="vibe-pill" data-vibe="Pet friendly">Pet friendly</button>
            <button type="button" class="vibe-pill" data-vibe="Great for hosting">Great for hosting</button>
          </div>
        </div>
      </aside>

      <div class="shop-main" id="listings">
                <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="fSearch" placeholder="Search by name, area, type or vibe" autocomplete="off">
                    <ul class="suggest" id="suggest" hidden></ul>
        </div>
                <div class="recent" id="recent" hidden></div>
        <div class="section-head">
          <p class="result-count" id="resultCount"></p>
          <label class="sort">
            <span>Sort by</span>
            <select id="sortBy">
              <option value="newest">Newest</option>
              <option value="priceLow">Price: low to high</option>
              <option value="priceHigh">Price: high to low</option>
            </select>
          </label>
        </div>

        <div class="grid" id="propertyGrid"></div>

        <p class="empty-note" id="noResults" hidden>
          No homes match those filters. Try removing one, or press <strong>Clear all</strong>.
        </p>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
    <script src="js/recent.js"></script>
</body>
</html>
